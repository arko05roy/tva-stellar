[package]
name = "tva-rpc"
version = "0.1.0"
edition = "2021"
description = "TVA Protocol RPC Translation Server - Ethereum JSON-RPC to Stellar/Soroban"
license = "MIT"

[dependencies]
# JSON-RPC server framework
jsonrpsee = { version = "0.24", features = ["server", "macros"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for Soroban RPC
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Hex encoding/decoding
hex = "0.4"

# Keccak256 hashing (for function selectors)
sha3 = "0.10"

# RLP encoding/decoding (for EVM transactions)
rlp = "0.5"

# ABI encoding/decoding
alloy-primitives = "0.8"
alloy-sol-types = "0.8"

# Environment configuration
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Base64 (for Stellar XDR)
base64 = "0.22"

# Numeric types
num-bigint = "0.4"
num-traits = "0.2"

# Ethereum types
ethereum-types = "0.15"

# Chrono for timestamps
chrono = "0.4"

# CORS middleware
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
http = "1"

# SQLite database for TVA chain state
rusqlite = { version = "0.31", features = ["bundled"] }

# Ed25519 key generation for Stellar wallet mirroring
ed25519-dalek = { version = "2", features = ["rand_core"] }

# Random number generation
rand = "0.8"

# SHA2 for key derivation
sha2 = "0.10"

# CRC for Stellar strkey checksum
crc = "3"

# secp256k1 for EVM transaction sender recovery
k256 = { version = "0.13", features = ["ecdsa"] }

[package]
name = "tva-parser"
version = "0.3.5"
authors = ["TVA Protocol Team"]
license = "Proprietary"
build = "build.rs"
description = "TVA Protocol Solidity Parser"
keywords = [ "solidity", "parser" ]
edition = "2021"

[build-dependencies]
lalrpop = { version = "0.20.0", default-features = false }

[dependencies]
lalrpop-util = "0.20.0"
phf = { version = "0.11", features = ["macros"] }
unicode-xid = "0.2"
itertools = "0.12"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
walkdir = "2.4"
regex = "1"
pretty_assertions = "1.3"

[features]
default = []
pt-serde = ["serde"]
